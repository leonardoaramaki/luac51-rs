name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  crate:
    name: Crate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo package --locked

  compatibility:
    name: Official Lua 5.1 and native memory checks
    runs-on: ubuntu-latest
    env:
      LUA51: ${{ runner.temp }}/lua-5.1.5/src/lua5.1
      LUAC51: ${{ runner.temp }}/lua-5.1.5/src/luac5.1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the official Lua 5.1.5 reference tools
        shell: bash
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/lua-5.1.5.tar.gz" \
            https://www.lua.org/ftp/lua-5.1.5.tar.gz
          printf '%s  %s\n' \
            '2640fc56a795f29d28ef15e13c34a47e223960b0240e8cb0a82d9b0738695333' \
            "$RUNNER_TEMP/lua-5.1.5.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/lua-5.1.5.tar.gz" -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/lua-5.1.5/src" -j2 generic \
            LUA_T=lua5.1 LUAC_T=luac5.1
      - run: cargo test --locked -- --include-ignored
      - name: Check allocation failures and memory safety
        shell: bash
        run: |
          clang -std=c11 -Wall -Wextra -Werror -g \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -include tests/native/allocations.h -Ivendor/lua-5.1.5/src \
            vendor/lua-5.1.5/src/l*.c tests/native/allocations.c -lm \
            -o target/test-allocations
          target/test-allocations tests/fixtures/program.lua
      - name: Check that native archives contain no execution routines
        shell: bash
        run: |
          for archive in target/debug/build/luac-*/out/libluac51.a; do
            test -f "$archive"
            nm -g --defined-only "$archive" > target/native-symbols.txt
            if grep -Eq '[[:space:]]_?lua(V_|C_|D_(call|precall)|_(call|pcall|resume|yield|newstate|close)|L_|U_undump|F_(new.*closure|findupval|close))' target/native-symbols.txt; then
              echo "Unexpected Lua execution symbol in $archive"
              exit 1
            fi
          done
